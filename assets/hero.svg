<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Skysheep — AI tools, data products, and digital experiments</title>
  <desc id="desc">An original abstract composition of a local AI window, data paths, and a small blue-green signal.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9f7"/>
      <stop offset="1" stop-color="#e9f0ee"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d8b8a"/>
      <stop offset="1" stop-color="#2f656b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#163337" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="26" fill="url(#wash)" stroke="#cbd9d5" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <circle cx="78" cy="70" r="6" fill="#4d8b8a"/>
    <text x="98" y="77" fill="#18383b" opacity=".68" font-size="17" font-weight="700" letter-spacing="2.4">LOCAL AI · DATA · EXPERIMENTS</text>
    <text x="74" y="188" fill="#142d31" font-size="88" font-weight="780" letter-spacing="-3">Skysheep</text>
    <text x="78" y="242" fill="#315b5e" font-size="29" font-weight="650">本地 AI · 数据产品 · 数字实验</text>
    <text x="78" y="286" fill="#587477" font-size="17">Building useful things from open-ended ideas.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="738" y="58" width="352" height="226" rx="18" fill="#142d31"/>
    <rect x="758" y="80" width="312" height="28" rx="8" fill="#1c4145"/>
    <circle cx="778" cy="94" r="5" fill="#91c7b0"/>
    <circle cx="796" cy="94" r="5" fill="#d7b56d"/>
    <circle cx="814" cy="94" r="5" fill="#c77b68"/>
    <path d="M776 157 C804 129 825 178 851 151 S899 126 925 157 S970 180 1000 143 S1041 124 1058 146" fill="none" stroke="#91c7b0" stroke-width="5" stroke-linecap="round"/>
    <path d="M776 203 C807 185 830 215 857 198 S904 173 930 202 S979 218 1005 188 S1037 178 1058 192" fill="none" stroke="#6da5ab" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <circle cx="925" cy="157" r="8" fill="#d7b56d"/>
    <circle cx="1000" cy="143" r="6" fill="#91c7b0"/>
  </g>

  <g fill="none" stroke="#a9c3be" stroke-width="2" opacity=".7">
    <path d="M646 80 C682 80 682 120 716 120"/>
    <path d="M646 244 C682 244 682 214 716 214"/>
  </g>
  <circle cx="646" cy="80" r="5" fill="#4d8b8a"/>
  <circle cx="646" cy="244" r="5" fill="#d7b56d"/>
</svg>
