<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">我们是不断发展的叙事 · To love is to see the universe in someone</title>
  <desc id="desc">A centered bilingual typing animation: each sentence is unveiled by a smooth continuous sweep, with a single caret that keeps a steady gap after the visible text.</desc>
  <style>
    .message-cn {
      fill: #315b5e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .message-en {
      fill: #315b5e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .reveal-cn { animation: reveal-cn 12s linear infinite; }
    .reveal-en { animation: reveal-en 12s linear infinite; }
    .caret { animation: caret 12s linear infinite; }
    @keyframes reveal-cn {
      0% { width: 0; }
      8% { width: 0; }
      25% { width: 250px; }
      38% { width: 250px; }
      50% { width: 0; }
      100% { width: 0; }
    }
    @keyframes reveal-en {
      0% { width: 0; }
      50% { width: 0; }
      58% { width: 0; }
      75% { width: 615px; }
      88% { width: 615px; }
      100% { width: 0; }
    }
    @keyframes caret {
      0% { transform: translateX(0); opacity: 1; }
      8% { transform: translateX(0); opacity: 1; }
      25% { transform: translateX(250px); opacity: 1; }
      38% { transform: translateX(250px); opacity: 1; }
      50% { transform: translateX(0); opacity: 0; }
      58% { transform: translateX(-182.5px); opacity: 0; }
      75% { transform: translateX(432.5px); opacity: 1; }
      88% { transform: translateX(432.5px); opacity: 1; }
      100% { transform: translateX(-182.5px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-cn { width: 250px; animation: none; }
      .reveal-en { width: 0; animation: none; }
      .message-en { display: none; }
      .caret { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typing-cn"><rect class="reveal-cn" x="325" y="12" height="48"/></clipPath>
    <clipPath id="typing-en"><rect class="reveal-en" x="142.5" y="12" height="48"/></clipPath>
  </defs>
  <text class="message-cn" x="325 350 375 400 425 450 475 500 525 550" y="45" clip-path="url(#typing-cn)">我们是不断发展的叙事</text>
  <text class="message-en" x="142.5 157.5 172.5 187.5 202.5 217.5 232.5 247.5 262.5 277.5 292.5 307.5 322.5 337.5 352.5 367.5 382.5 397.5 412.5 427.5 442.5 457.5 472.5 487.5 502.5 517.5 532.5 547.5 562.5 577.5 592.5 607.5 622.5 637.5 652.5 667.5 682.5 697.5 712.5 727.5 742.5" y="45" clip-path="url(#typing-en)">To love is to see the universe in someone</text>
  <rect class="caret" x="333" y="19" width="3" height="30" rx="1.5" fill="#4d8b8a"/>
</svg>
