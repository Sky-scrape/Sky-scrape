<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">我们是不断发展的叙事 · To love is to see the universe in someone</title>
  <desc id="desc">Centered bilingual typing animation with a blinking caret.</desc>
  <style>
    .message {
      fill: #315b5e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: .2px;
      text-anchor: middle;
    }
    .reveal-cn { animation: reveal-cn 12s steps(11, end) infinite; }
    .reveal-en { animation: reveal-en 12s steps(43, end) infinite; }
    .caret-cn { animation: caret-cn 12s steps(11, end) infinite, blink .75s step-end infinite; }
    .caret-en { animation: caret-en 12s steps(43, end) infinite, blink .75s step-end infinite; }
    @keyframes reveal-cn {
      0%, 8% { width: 0; x: 450px; }
      25%, 38% { width: 275px; x: 312.5px; }
      50%, 100% { width: 0; x: 450px; }
    }
    @keyframes reveal-en {
      50%, 58% { width: 0; x: 450px; }
      75%, 88% { width: 635px; x: 132.5px; }
      100% { width: 0; x: 450px; }
    }
    @keyframes caret-cn {
      0%, 8% { transform: translateX(0); visibility: visible; }
      25%, 38% { transform: translateX(137.5px); visibility: visible; }
      50%, 100% { transform: translateX(0); visibility: hidden; }
    }
    @keyframes caret-en {
      0%, 49% { transform: translateX(0); visibility: hidden; }
      50%, 58% { transform: translateX(0); visibility: visible; }
      75%, 88% { transform: translateX(317.5px); visibility: visible; }
      100% { transform: translateX(0); visibility: hidden; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal-cn { width: 275px; x: 312.5px; animation: none; }
      .reveal-en { width: 635px; x: 132.5px; animation: none; }
      .caret-cn, .caret-en { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typing-cn"><rect class="reveal-cn" y="12" height="48"/></clipPath>
    <clipPath id="typing-en"><rect class="reveal-en" y="12" height="48"/></clipPath>
  </defs>
  <text class="message" x="450" y="45" clip-path="url(#typing-cn)">我们是不断发展的叙事</text>
  <rect class="caret-cn" x="450" y="19" width="3" height="30" rx="1.5" fill="#4d8b8a"/>
  <text class="message" x="450" y="45" clip-path="url(#typing-en)">To love is to see the universe in someone</text>
  <rect class="caret-en" x="450" y="19" width="3" height="30" rx="1.5" fill="#4d8b8a"/>
</svg>
